# Render 배포 설정 (Blueprint)
# Render 대시보드 → New → Blueprint → 이 GitHub 저장소를 고르면 아래대로 서버가 만들어진다.
services:
  - type: web
    name: hamkki
    runtime: python
    plan: free
    # 저장소 맨 위(hamkki)에서 실행한다. app.py가 위 폴더의 collect_restaurants.py를 쓰기 때문.
    # 빌드 때 식당을 미리 수집한다. 빌드에서 만든 파일은 서버 이미지에 포함되어 서버가 잠들었다 깨어나도 남는다.
    # 실행 중에 생기는 데이터(투표, 검색 때 새로 모은 칸)는 아래 Postgres(hamkki-db)에 저장한다.
    # 빌드 단계 수집은 DATABASE_URL을 비워서 파일로 저장 → 서버 이미지에 포함된다.
    # data/는 GitHub에 올리지 않는다(카카오 데이터 재배포 방지). 수집이 실패해도 배포는 계속하고 검색 때 자동 수집에 맡긴다.
    # 미리 모을 지역을 늘리려면 뒤에 역 이름을 붙인다. 예: ... --area 의정부시 의정부역 홍대입구역 강남역
    buildCommand: >-
      pip install -r hamkki_app/requirements.txt &&
      (DATABASE_URL= python collect_restaurants.py --area 의정부시 의정부역 || echo "[빌드] 식당 미리 수집 실패 - 검색 때 자동 수집으로 대신합니다")
    # 워커 1개 + 스레드 4개: 하루 수집 한도가 한 프로세스 메모리에만 있으므로 워커는 1개로 둔다.
    # timeout 120초: 새 지역 자동 수집 + AI 추천(최대 40초)까지 기다릴 수 있게.
    startCommand: gunicorn --chdir hamkki_app app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: KAKAO_REST_KEY
        sync: false          # 값은 Render 화면에서 직접 입력 (GitHub에 올리지 않음)
      - key: KAKAO_JS_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false          # 통계 페이지(/admin/stats?key=...) 비밀번호. Render 화면에서 직접 입력
      - key: SECRET_KEY
        generateValue: true  # Render가 무작위 값을 만들어 줌
      - key: HAMKKI_DEBUG
        value: "0"           # 배포에서는 오류 원인을 화면에 숨긴다
      - key: DATABASE_URL    # 아래 DB의 내부 접속 주소를 Render가 자동으로 넣어 줌
        fromDatabase:
          name: hamkki-db
          property: connectionString

# 무료 Postgres: 1GB, 만든 날부터 30일 뒤 만료 (11/24 생성 → 12/24쯤 만료. 11/30 제출·12/1 데모데이 이후까지 유지)
# 학기 후에도 쓰려면 Neon 같은 만료 없는 DB를 만들고 DATABASE_URL만 그 주소로 바꾸면 된다(코드 수정 없음).
databases:
  - name: hamkki-db
    plan: free
    databaseName: hamkki
    user: hamkki
