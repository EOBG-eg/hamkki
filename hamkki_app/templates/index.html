{% extends "base.html" %}
{% block content %}

<section class="hk-hero">
  <h1>오늘, 누구랑<br>어디서 먹을까요?</h1>
  <p>상황만 알려주세요. 고르는 건 함끼가, 정하는 건 다 같이.</p>
</section>

{% if not regions %}
<div class="alert alert-warning">
  아직 식당 데이터가 없어요. 먼저 <code>python collect_restaurants.py 지역이름</code>을 실행해 주세요.
</div>
{% endif %}

<form action="{{ url_for('recommend') }}" method="post" class="hk-form">

  <div class="hk-field">
    <label class="hk-label" for="region">어디 근처에서 찾을까요?</label>
    <select class="form-select hk-region" id="region" name="region">
      {% for name, r in regions.items() %}
      <option value="{{ name }}">📍 {{ name }}{% if r.count %} · {{ r.count }}곳{% endif %}</option>
      {% endfor %}
    </select>
  </div>

  <div class="hk-field">
    <label class="hk-label">어떤 자리인가요?</label>
    <div class="hk-chips">
      {% for name, s in situations.items() %}
      <input type="radio" class="btn-check" name="situation" id="sit-{{ loop.index }}"
             value="{{ name }}" {% if name == "친구" %}checked{% endif %}>
      <label class="hk-chip" for="sit-{{ loop.index }}">
        <span class="hk-chip-emoji">{{ s.emoji }}</span>{{ name }}
      </label>
      {% endfor %}
    </div>
  </div>

  <div class="hk-row">
    <div class="hk-field">
      <label class="hk-label" for="people">인원</label>
      <div class="hk-stepper">
        <button type="button" onclick="step(-1)" aria-label="한 명 줄이기">−</button>
        <input type="number" id="people" name="people" value="2" min="1" max="30">
        <button type="button" onclick="step(1)" aria-label="한 명 늘리기">+</button>
      </div>
    </div>
    <div class="hk-field">
      <label class="hk-label" for="time_slot">시간대</label>
      <select class="form-select" id="time_slot" name="time_slot">
        {% for t in time_slots %}
        <option {% if t == "저녁" %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="hk-row">
    <div class="hk-field">
      <label class="hk-label" for="budget">1인 예산</label>
      <select class="form-select" id="budget" name="budget">
        <option value="">상관없음</option>
        {% for b in budgets %}<option>{{ b }}</option>{% endfor %}
      </select>
    </div>
    <div class="hk-field">
      <label class="hk-label" for="kind">음식 종류</label>
      <select class="form-select" id="kind" name="kind">
        <option value="">상관없음</option>
        {% for k in kinds %}<option>{{ k }}</option>{% endfor %}
      </select>
    </div>
  </div>

  <div class="hk-field">
    <label class="hk-label" for="wish">원하는 분위기를 자유롭게 적어주세요</label>
    <textarea class="form-control" id="wish" name="wish" rows="3" maxlength="200"
      placeholder="예) 부모님 모시고 갈 조용한 한식집"></textarea>
  </div>

  <button type="submit" class="hk-submit" {% if not regions %}disabled{% endif %}>함끼에게 맡겨보기</button>
</form>

<script>
  function step(n) {
    const el = document.getElementById("people");
    el.value = Math.max(1, Math.min(30, (parseInt(el.value) || 1) + n));
  }
</script>
{% endblock %}
