<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}함끼{% endblock %} · AI가 고르고, 함께 정하는 한 끼</title>
  {# 카톡·문자로 링크를 보낼 때 뜨는 미리보기 카드 (Open Graph). 투표 화면은 제목·설명을 바꾼다 #}
  <meta name="description" content="{% block og_desc %}상황만 말하면 AI가 근처 식당 3곳을 골라 주고, 친구들과 링크 하나로 투표해서 정해요.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="함끼">
  <meta property="og:title" content="{% block og_title %}함끼 · AI가 고르고, 함께 정하는 한 끼{% endblock %}">
  <meta property="og:description" content="{{ self.og_desc() }}">
  <meta property="og:image" content="{{ url_for('static', filename='og.png', _external=True) }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="{{ request.base_url }}">
  <meta name="theme-color" content="#e2552d">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <header class="hk-header">
    <a href="{{ url_for('index') }}" class="hk-logo">함끼<span>Hamkki</span></a>
  </header>

  <main class="hk-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="hk-footer">
    함끼 · 소프트웨어개발 3회차 프로젝트
  </footer>
</body>
</html>
